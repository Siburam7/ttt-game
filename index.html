    <link rel="stylesheet" href="rpc.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

<body>
    <div class="text-top">
        <div class="img-top"></div>
        <div class="img-buttom"></div>

        <!-- <div class="line-top"></div> -->
    </div>

    <div class="nav">
        <div class="score-bord-main glass">
            <div class="score-bord humam">
                <div class="box-x you-box">
                    <h3>You</h3>
                </div>

                <div class="line"></div>

                <div class="box-y you-text-box">
                    <h2 id="human-win-count">0</h2>
                </div>
            </div>

            <div class="score-bord round">
                <div class="round-text-box">
                    <h2 id="Round-text">Start</h2>
                </div>
            </div>

            <div class="score-bord ai">
                <div class="box-x ai-box">
                    <h3>AI</h3>
                </div>

                <div class="line"></div>

                <div class="box-y ai-text-box">
                    <h2 id="ai-win-count" >0</h2>
                </div>
            </div>
        </div>

    </div>


    <div class="main glass">
        <div class="circle-comp-main">
            <div class="cir-comp">
                <div id="cir-comp-x"></div>
                <h3 id="cir-comp-x-text">Rock</h3>
            </div>

            <div class="gap-main">
            <h1>Vs</h1>
            </div>

            <div class="cir-comp">
                <div id="cir-comp-y"></div>
                <h3 id="cir-comp-y-text">Paper</h3>
            </div>
        </div>

        <div class="circle-user-main">
            <div class="cir-main">
                <div class="cir1">
                    <div class="cir-x" id="rock-img"></div>
                    <h2>Rock</h2>
                </div>
                <div class="cir1">
                    <div class="cir-x" id="paper-img"></div>
                    <h2>Paper</h2>
                </div>
                <div class="cir1">
                    <div class="cir-x" id="scissors-img"></div>
                    <h2>Scissors</h2>
                </div>
            </div>

            <div class="option-main">
                <div class="text-massage">
                    <h2 id="win-loss-main">VICTORY</h2>
                </div>

                <div class="play-next-main">
                    <div class="play-next-button">
                        <h2>Next Round Start in</h2>
                        <h2 id="count-down"></h2>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="reset-game-box">
        <a href="#">Reset Game?</a>
    </div>


    <div class="history glass">
        <div class="round-box round-1">
            <div class="win-his">
